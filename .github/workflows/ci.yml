name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # check-latest resolves the newest Node 22 release from the release
      # manifest; without it setup-node uses any 22.x cached on the runner,
      # which can predate a security release.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
